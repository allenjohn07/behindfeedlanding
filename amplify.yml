# Used when Amplify builds from the standalone landing repo (allenjohn07/behindfeedlanding).
# When Amplify builds from the monorepo it uses ../amplify.yml (appRoot: landing) instead.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
